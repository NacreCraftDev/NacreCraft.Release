    template: examples/NcLists.cs
    members: [WhiteList, Ops, Bans, IpBans, Settings, IsOp, IsBanned, IsWhitelisted]
  - id: NacreCraft.ModApi.Wrapper.NcStartup
    title: Startup arguments
