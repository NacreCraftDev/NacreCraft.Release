    template: examples/NcStartup.cs
    members: [Ready, Arguments, IsReady, Has, Value, Values, Subscribe]
  - id: NacreCraft.ModApi.Wrapper.ServerEvents
    title: Server events
    summary: Subscribe to lifecycle, player, chunk, block, interaction and command events.
    template: examples/ServerEvents.cs
